services:
  - type: web
    name: assistant-demo
    runtime: python
    plan: free                 # gratuit pour tester ; passer Ã  "starter" (~7$/mois) pour un client
    region: frankfurt          # Europe ; "oregon" pour l'AmÃ©rique du Nord
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false            # Ã  saisir Ã  la main dans Render, jamais dans le code
      - key: DATA_DIR
        value: data
      - key: PYTHON_VERSION
        value: "3.12"